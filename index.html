<!DOCTYPE html><html><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><circle cx='8' cy='8' r='7' fill='%23ff6a1a' stroke='black' stroke-width='2'/></svg>">
<title>SineRally</title>
<style>
html,body{margin:0;height:100%;overflow:hidden;background:#f7e6b5;font-family:"Arial Black","Impact",system-ui,sans-serif;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
canvas{display:block}
body>canvas:first-child{background:#000} /* WebGL alpha carries the ink-edge code; black backing keeps colours exact in Low (no post) */
.ink{color:#fff;-webkit-text-stroke:1.5px #111;text-shadow:3px 3px 0 #111;font-style:italic}
#hud{position:fixed;top:max(6px,env(safe-area-inset-top));left:max(10px,env(safe-area-inset-left));right:max(10px,env(safe-area-inset-right));display:flex;justify-content:space-between;align-items:flex-start;pointer-events:none}
#spdbox{display:flex;align-items:baseline;gap:6px}#spd{font-size:40px;line-height:1}#unit{font-size:14px}
#boost{width:150px;height:14px;border:3px solid #111;background:#fff8;transform:skewX(-20deg);margin-top:4px;box-shadow:3px 3px 0 #111}
#bar{height:100%;background:repeating-linear-gradient(90deg,#ff8a1a 0 8px,#ffd23c 8px 12px);width:100%}
#air{font-size:22px;color:#ffd23c;margin-top:6px}
#race{font-size:17px;text-align:center;padding-top:4px}#race small{font-size:13px}
#dbg{position:fixed;left:max(10px,env(safe-area-inset-left));bottom:4px;font:bold 11px monospace;white-space:pre;color:#111;background:#fff8;pointer-events:none}
#mini{position:fixed;right:max(10px,env(safe-area-inset-right));top:max(8px,env(safe-area-inset-top));border-radius:50%;border:4px solid #111;background:#f7e6b5cc;box-shadow:4px 4px 0 #111}
#topbtns{position:fixed;left:max(10px,env(safe-area-inset-left));top:calc(max(6px,env(safe-area-inset-top)) + 90px);display:flex;gap:6px}
.sb{background:#ffd23c;border:3px solid #111;border-radius:6px;padding:5px 9px;font:900 12px "Arial Black",system-ui;color:#111;box-shadow:3px 3px 0 #111;transform:skewX(-8deg)}
#joy{position:fixed;left:calc(max(12px,env(safe-area-inset-left)) + 88px);bottom:calc(20px + env(safe-area-inset-bottom,0px));width:140px;height:140px;border-radius:50%;background:#fff3;border:4px solid #111;display:none;box-shadow:4px 4px 0 #1118}
#knob{position:absolute;left:41px;top:41px;width:50px;height:50px;border-radius:50%;background:#ffd23c;border:4px solid #111}
.btn{position:fixed;width:74px;height:74px;border-radius:50%;border:4px solid #111;color:#fff;font:900 13px "Arial Black",system-ui;display:none;align-items:center;justify-content:center;box-shadow:4px 4px 0 #111;-webkit-text-stroke:1px #111}
.btn.on{transform:translate(3px,3px);box-shadow:1px 1px 0 #111}
#bGas{right:max(22px,env(safe-area-inset-right));bottom:calc(26px + env(safe-area-inset-bottom,0px));background:#38c45a}#bBrk{right:calc(max(22px,env(safe-area-inset-right)) + 92px);bottom:calc(16px + env(safe-area-inset-bottom,0px));background:#e8453c}
/* nitro: bottom-left corner (left thumb, beside the joystick, inside the safe area); drift took boost's old slot above GAS */
#bBst{left:max(12px,env(safe-area-inset-left));bottom:calc(30px + env(safe-area-inset-bottom,0px));width:70px;height:70px;background:#ff8a1a}#bDrf{right:calc(max(22px,env(safe-area-inset-right)) + 14px);bottom:calc(116px + env(safe-area-inset-bottom,0px));background:#3c7ce8}
#bUnl{position:fixed;right:calc(max(22px,env(safe-area-inset-right)) + 104px);bottom:calc(112px + env(safe-area-inset-bottom,0px));display:none;z-index:5}
/* corner toggles (left of the minimap): UI hide (always visible) + handling ARC/NRM */
#tUi,#tHand{position:fixed;top:max(8px,env(safe-area-inset-top));z-index:7;padding:4px 8px;font-size:13px;min-width:34px;height:30px}
#tUi{right:calc(max(10px,env(safe-area-inset-right)) + 146px)}#tHand{right:calc(max(10px,env(safe-area-inset-right)) + 190px);background:#38c45a;color:#fff;-webkit-text-stroke:.6px #111}#tHand.nrm{background:#8a94a6}
body.ui-min #topbtns,body.ui-min #dbg,body.ui-min #labels,body.ui-min #cans,body.ui-min #carinfo,body.ui-min #air,body.ui-min #race{display:none!important}
body.ui-min #mini{width:84px;height:84px;border-width:3px}body.ui-min #tUi{right:calc(max(10px,env(safe-area-inset-right)) + 98px)}body.ui-min #tHand{right:calc(max(10px,env(safe-area-inset-right)) + 142px)}
body.ui-none #hud,body.ui-none #mini,body.ui-none #cans,body.ui-none #wp,body.ui-none #gauge,body.ui-none #topbtns,body.ui-none #dbg,body.ui-none #labels,body.ui-none #msg,body.ui-none #tHand,body.ui-none #bUnl{display:none!important}
body.ui-none #joy,body.ui-none .btn{opacity:0} /* touch zones keep working invisibly */
body.ui-none #tUi{right:max(10px,env(safe-area-inset-right));opacity:.28;box-shadow:none}
#msg{position:fixed;top:36%;width:100%;text-align:center;font-size:44px;pointer-events:none}
.pop{animation:pop .35s ease-out}@keyframes pop{0%{transform:scale(2.2) rotate(-6deg)}100%{transform:scale(1) rotate(-3deg)}}
#gauge{position:fixed;left:50%;bottom:calc(4px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);pointer-events:none;filter:drop-shadow(3px 3px 0 #1116)}
@media (max-height:420px){#gauge{width:160px;height:96px}}
#rot{position:fixed;inset:0;background:#ffd23c;color:#111;display:none;align-items:center;justify-content:center;font-size:22px;z-index:9}
@media (orientation:portrait) and (pointer:coarse){#rot{display:flex}}
#mini{cursor:pointer;pointer-events:auto;z-index:6}
#cans{position:fixed;right:max(10px,env(safe-area-inset-right));top:calc(max(8px,env(safe-area-inset-top)) + 142px);width:138px;text-align:center;font:900 15px "Arial Black",system-ui;color:#fff;-webkit-text-stroke:1px #111;text-shadow:2px 2px 0 #111;pointer-events:none}
#wp{position:fixed;left:50%;top:max(8px,env(safe-area-inset-top));transform:translateX(-50%);display:none;text-align:center;pointer-events:none;z-index:4}
#wpA{width:44px;height:44px;margin:0 auto;font:900 34px/44px "Arial Black",system-ui;color:#e8453c;-webkit-text-stroke:2px #111;text-shadow:3px 3px 0 #111}
#wpD{font:900 13px "Arial Black",system-ui;color:#fff;-webkit-text-stroke:1px #111;text-shadow:2px 2px 0 #111}
#map{position:fixed;inset:0;display:none;z-index:20;background:#f7e6b5}
#mapc{position:absolute;inset:0;width:100%;height:100%;cursor:crosshair}
#mapui{position:absolute;left:max(10px,env(safe-area-inset-left));top:max(8px,env(safe-area-inset-top));display:flex;gap:6px;flex-wrap:wrap;align-items:center}
#mInfo{font:900 13px "Arial Black",system-ui;color:#fff;-webkit-text-stroke:1px #111;text-shadow:2px 2px 0 #111;margin-left:6px}
#mList{position:absolute;right:max(10px,env(safe-area-inset-right));top:max(8px,env(safe-area-inset-top));bottom:10px;width:190px;overflow:auto;display:flex;flex-direction:column;gap:6px;font:900 12px "Arial Black",system-ui;color:#111;text-align:right}
#mList i{background:#fffd;border:2px solid #111;padding:6px;font-style:normal}
#menu{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);display:none;z-index:21;background:#f7e6b5;border:4px solid #111;box-shadow:6px 6px 0 #111;padding:10px 14px;max-height:92vh;overflow:auto}
#mSnd select{font:900 12px "Arial Black",system-ui;transform:none;max-width:240px}#mSnd input[type=range]{width:140px}
#menu h3{margin:0 0 6px;font:900 18px "Arial Black",system-ui}
.mrow{display:flex;gap:6px;align-items:center;margin:6px 0;flex-wrap:wrap}.mrow span{width:150px;font:900 12px "Arial Black",system-ui}
.sb.sel{background:#ff6a1a;color:#fff}
/* merged physics module: tree HP labels, pop text, car selector + attachment picker in ☰ */
#labels{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:3}
.hp{position:absolute;transform:translate(-50%,-100%);font:900 10px "Arial Black",system-ui;text-align:center;white-space:nowrap;color:#fff;-webkit-text-stroke:.6px #111;text-shadow:2px 2px 0 #111}
.hp .segs{display:flex;gap:2px;justify-content:center;margin-bottom:2px}.hp .seg{width:13px;height:7px;border:2px solid #111;background:#333;position:relative;overflow:hidden;transform:skewX(-12deg)}
.hp .seg i{position:absolute;left:0;top:0;bottom:0;background:#7fe07f}.hp.hit{font-size:13px;z-index:2}.hp.hit .seg{width:19px;height:10px}
.ptxt{position:absolute;transform:translate(-50%,-100%);font:900 20px "Arial Black",system-ui;font-style:italic;color:#ff5030;-webkit-text-stroke:1.5px #111;text-shadow:3px 3px 0 #111;transition:transform .9s ease-out,opacity .9s;pointer-events:none}
#carinfo{font:900 11px "Arial Black",system-ui;margin-top:4px;-webkit-text-stroke:.8px #111;text-shadow:2px 2px 0 #111}
#mVeh .vsel{display:grid;grid-template-columns:auto 1fr;gap:8px;align-items:start;margin:4px 0 8px}
#mVeh .vprev{width:240px;height:136px;background:radial-gradient(#bfe6ff,#7fc8ff);border:3px solid #111;border-radius:8px}
#mVeh .vinfo{font:900 11px "Arial Black",system-ui;max-width:300px}#mVeh .vinfo b{font-size:17px}#mVeh .vinfo small{display:block;font:bold 11px Arial,sans-serif;margin:2px 0 4px}
#mVeh .stats{line-height:1.6}#mVeh .mnt{font:bold 11px Arial,sans-serif;margin-top:4px}#mVeh .pips{font-style:normal;color:#e8302a;letter-spacing:-1px;margin-right:4px}#mVeh .pips u{color:#bbb;text-decoration:none}
#mVeh .vlist{grid-column:1/3;display:flex;flex-wrap:wrap;gap:6px}
#mVeh button,#mAtt button{background:#ffd23c;border:3px solid #111;border-radius:6px;padding:5px 9px;font:900 12px "Arial Black",system-ui;color:#111;box-shadow:3px 3px 0 #111;transform:skewX(-8deg)}
#mVeh button.on,#mAtt button.on{background:#ff6a1a;color:#fff}
#mAtt .arow{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin:5px 0}#mAtt .alab{width:58px;font:900 11px "Arial Black",system-ui}#mAtt .adesc{font:bold 11px Arial,sans-serif;margin:-2px 0 4px 64px;max-width:420px}
@media (max-height:500px){#mVeh .vprev{width:200px;height:113px}#menu{padding:8px 10px}}
/* engine sound editor (☰ → ENGINE SOUND → EDIT): compact side panel, sections collapsed by default */
#sndEd{position:fixed;right:max(8px,env(safe-area-inset-right));top:max(6px,env(safe-area-inset-top));bottom:max(6px,env(safe-area-inset-bottom));width:min(360px,48vw);display:none;z-index:22;overflow:auto;-webkit-overflow-scrolling:touch;
  background:#f7e6b5f2;border:4px solid #111;box-shadow:5px 5px 0 #111;padding:6px 8px;font:900 11px "Arial Black",system-ui;color:#111;touch-action:pan-y;-webkit-user-select:none;user-select:none}
#sndEd .se-h{display:flex;justify-content:space-between;align-items:center;gap:6px;margin-bottom:4px}#sndEd .se-h b{font-size:13px}
#sndEd .se-lights{width:100%;height:34px;border:3px solid #111;border-radius:6px;cursor:pointer;display:block}
#sndEd .se-info{font:bold 10px monospace;margin:3px 0}
#sndEd .se-test{display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin:4px 0}#sndEd .se-test small{font:bold 10px Arial,sans-serif;opacity:.75}
#sndEd details{border:3px solid #111;border-radius:6px;margin:5px 0;background:#fff6;padding:0 6px}#sndEd summary{padding:6px 0;cursor:pointer;font-size:12px;list-style-position:inside}
#sndEd .se-r{display:grid;grid-template-columns:96px 1fr 40px;align-items:center;gap:4px;margin:4px 0}#sndEd .se-r b{font:bold 10px monospace;text-align:right}
#sndEd .se-r select,#sndEd .se-r input[type=text]{grid-column:2/4;font:900 11px "Arial Black",system-ui;border:2px solid #111;padding:3px;background:#fff;min-width:0}
#sndEd input[type=range]{width:100%;min-width:0;margin:0;height:22px}
#sndEd input[type=text],#sndEd textarea{-webkit-user-select:text;user-select:text}
#sndEd textarea{width:100%;box-sizing:border-box;font:10px monospace;border:2px solid #111;margin:4px 0}
#sndEd .se-chips{display:flex;flex-wrap:wrap;gap:4px;margin:4px 0}#sndEd .se-chip{min-width:30px;height:28px;border:3px solid #111;border-radius:50%;background:#3a2a1a;color:#ffd23c;font:900 11px "Arial Black",system-ui}
#sndEd .se-chip.on{background:#ffd23c;color:#111}#sndEd .se-sub{font-size:11px;margin:4px 0}
#sndEd .se-note{font:bold 10px Arial,sans-serif;opacity:.8;margin:2px 0 6px}#sndEd .se-row{display:flex;flex-wrap:wrap;gap:5px;align-items:center;margin:5px 0}
#sndEd .se-row input[type=text]{width:110px;font:900 11px "Arial Black",system-ui;border:2px solid #111;padding:4px}#sndEd .se-named{display:inline-flex;gap:2px}
</style><meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="apple-mobile-web-app-title" content="SineRally">
<meta name="theme-color" content="#ff6a1a"><meta name="format-detection" content="telephone=no">
<link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<style>/* iOS home-screen */canvas{touch-action:none;-webkit-touch-callout:none;-webkit-user-select:none;user-select:none}#allBuilds{display:inline-block;text-decoration:none;font:900 12px "Arial Black",system-ui,sans-serif;color:#111;background:#fff;border:3px solid #111;border-radius:6px;padding:5px 9px;box-shadow:3px 3px 0 #111;-webkit-tap-highlight-color:transparent}</style>
</head><body>
<div id="hud"><div><div id="spdbox" class="ink"><span id="spd">0</span><span id="unit">KM/H</span></div><div id="boost"><div id="bar"></div></div><div id="air" class="ink"></div><div id="carinfo" class="ink"></div></div>
<div id="race" class="ink"></div><div style="width:140px"></div></div>
<canvas id="mini" width="130" height="130" title="World map (M)"></canvas><div id="cans">⛽ 0</div>
<div id="wp"><div id="wpA">▲</div><div id="wpD"></div></div>
<div id="map"><canvas id="mapc"></canvas><div id="mapui"><button class="sb" id="mClose">✕ BACK</button><button class="sb" id="mZin">＋</button><button class="sb" id="mZout">－</button><button class="sb" id="mClr">CLEAR WAYPOINT</button><span id="mInfo"></span></div><div id="mList"></div></div>
<div id="menu"><h3>SINERALLY<a style="float:right;margin-left:12px" id="allBuilds" href="https://leck-games.github.io/">‹ ALL BUILDS</a></h3><div id="mVeh" style="display:none"></div><div id="mAtt"></div><div id="mRows"></div><div id="mSnd"></div><div class="mrow"><button class="sb" id="mnClose">✕ CLOSE</button></div></div>
<div id="topbtns"><button class="sb" id="tMenu">☰</button><button class="sb" id="tReset">⟲ RESET</button><button class="sb" id="tQ">GFX</button><button class="sb" id="tTilt">Tilt: off</button><button class="sb" id="tDbg">FPS</button><button class="sb" id="tSnd" data-snd-own title="Engine sound mute">🔊</button></div>
<div id="dbg"></div>
<div id="joy"><div id="knob"></div></div>
<div class="btn" id="bGas">GAS</div><div class="btn" id="bBrk">BRAKE</div><div class="btn" id="bBst">BOOST</div><div class="btn" id="bDrf">DRIFT</div>
<canvas id="gauge" width="200" height="120"></canvas>
<button class="sb" id="bUnl">UNLOAD</button><button class="sb" id="tUi" title="UI">◉</button><button class="sb" id="tHand" title="Handling (H)">ARC</button>
<div id="labels"></div><div id="msg" class="ink"></div><div id="rot">ROTATE TO LANDSCAPE ↻</div>

<script type="module" src="js/main.js"></script>
